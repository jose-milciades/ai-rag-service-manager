# Conexión SonarQube 
sonar.host.url=http://ediaidev.softwarecumbre.com:9000/

# Identificación del proyecto
sonar.projectKey=ai-rag-service-manager
sonar.projectName=ai-rag-service-manager
sonar.projectVersion=1.0

# Codificación y alcance del análisis
sonar.sourceEncoding=UTF-8
sonar.sources=app
sonar.tests=test
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.exclusions=**/__pycache__/**,**/.venv/**,**/.history/**,**/.github/**,**/.vscode/**,**/.idea/**,**/.pytest_cache/**,**/.mypy_cache/**,**/.ruff_cache/**,**/.env,**/.env.*,**/*.md,**/docs/**,logs/**

# Excluir __init__.py y archivos de test de métricas de cobertura de código fuente
sonar.coverage.exclusions=**/__init__.py,test/**