name: CI

# Pipeline minimo segun README.md ("Estandar de calidad...", seccion 31/32).
# Ver pendientes.md P-18 para el detalle de que se cubre aqui y que sigue
# pendiente (coverage real de pytest, SonarQube Quality Gate obligatorio).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Ruff, mypy, Bandit, pip-audit, pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: Bandit
        run: uv run bandit -r app/

      - name: pip-audit
        run: uv run pip-audit

      - name: pytest
        # P-07 (pendientes.md): todavia no hay tests escritos, por lo que
        # "no tests collected" no debe romper el pipeline. Quitar
        # continue-on-error una vez exista una suite real con cobertura.
        run: uv run pytest --cov=app --cov-report=term-missing
        continue-on-error: true

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-rag-service-manager:${{ github.sha }} .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ai-rag-service-manager:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

  gitleaks:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: quality
    # Requiere el secret SONAR_TOKEN y que el runner tenga red hacia el
    # sonar.host.url definido en sonar-project.properties (hoy un servidor
    # interno). Si no esta disponible desde runners hosteados por GitHub,
    # correr con un self-hosted runner o quitar este job.
    if: ${{ false }} # deshabilitado hasta confirmar conectividad al server interno; ver pendientes.md P-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
